# HTTP to HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name stash.example.com;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

# Main HTTPS Server Block
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name stash.example.com;

    client_max_body_size 5G;

    # SSL Certificates (Cloudflare edge handles public cert; snakeoil handles origin encryption)
    ssl_certificate /etc/ssl/certs/ssl-cert-snakeoil.pem;
    ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;

    # API Backend (Your backend service running on port 8000)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;

        # Identity Headers using Cloudflare shortcuts
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for API stability
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Frontend Web App (Vite server running on port 3000)
    location / {
        proxy_pass http://127.0.0.1:3001;

        # Identity Headers using Cloudflare shortcuts
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
    }
}