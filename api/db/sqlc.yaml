version: "2"
plugins:
- name: python
  wasm:
    url: https://github.com/rayakame/sqlc-gen-better-python/releases/download/v0.9.0/sqlc-gen-better-python.wasm
    sha256: d1787aa32e61f2e73c81a4f93b3e5a9beeec918952cff3183fb96313057f58a8
sql:
- engine: "postgresql"
  queries: "query.sql"
  schema: "schema.sql"
  codegen:
    - out: "."
      plugin: python
      options:
        package: "db"
        emit_init_file: true
        sql_driver: "psycopg_async"
        model_type: "pydantic"
        import_text: true
        import_datetime: true
